<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>الفيصل – France Lait | المتجر</title>
<link href="https://fonts.googleapis.com/css2?family=Baloo+Bhaijaan+2:wght@600;800&family=Cairo:wght@400;600;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#F3F9FE;--card:#fff;--ink:#14275E;--mute:#4A5675;--line:#D5E6F5;--soft:#EAF3FB;--navy:#14275E;--on-navy:#fff;--red:#C42945;--on-red:#fff;--sky1:#BFE3FA;--sky2:#F3F9FE;--hd:rgba(255,255,255,.92);color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0D1427;--card:#162039;--ink:#EEF1FA;--mute:#A9B3CF;--line:#2A3556;--soft:#1F2A47;--navy:#1B2B63;--red:#EF6A84;--on-red:#10091A;--sky1:#1D3466;--sky2:#0D1427;--hd:rgba(13,20,39,.92);color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0D1427;--card:#162039;--ink:#EEF1FA;--mute:#A9B3CF;--line:#2A3556;--soft:#1F2A47;--navy:#1B2B63;--red:#EF6A84;--on-red:#10091A;--sky1:#1D3466;--sky2:#0D1427;--hd:rgba(13,20,39,.92);color-scheme:dark}
html{scroll-padding-top:calc(env(safe-area-inset-top,0px) + 130px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:'Cairo',system-ui,sans-serif;padding-bottom:96px}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:var(--hd);z-index:10}
.wrap{max-width:1100px;margin:auto;padding:0 20px}
header{background:var(--hd);backdrop-filter:blur(10px);position:sticky;top:env(safe-area-inset-top,0px);z-index:9;border-bottom:2px solid var(--line)}
.hd{display:flex;justify-content:space-between;align-items:center;gap:12px;padding-top:12px}
.brand{display:flex;align-items:center;gap:12px;min-width:0}
.logo{height:56px;width:auto;border-radius:10px;background:#fff;flex:none}
.ht{display:flex;flex-direction:column;line-height:1.25}
.ht b{font-family:'Baloo Bhaijaan 2',sans-serif;font-size:22px}
.ht span{font-size:13px;color:var(--mute);font-weight:600;direction:ltr;text-align:start}
.ct{display:flex;flex-direction:column;align-items:center;gap:2px}
.cn{font-size:13px;font-weight:700}
.call{background:#1B7A43;color:#fff;font-weight:800;text-decoration:none;border-radius:24px;padding:0 16px;min-height:44px;display:inline-flex;align-items:center;gap:8px;direction:ltr}
.tabs{display:flex;gap:8px;overflow-x:auto;padding:10px 0 12px}
.tabs button{font:inherit;font-weight:700;font-size:16px;white-space:nowrap;background:var(--soft);color:var(--ink);border:2px solid transparent;border-radius:24px;padding:0 18px;min-height:44px;cursor:pointer}
.tabs button[aria-pressed="true"]{background:var(--navy);color:var(--on-navy)}
.hero{background:linear-gradient(180deg,var(--sky1),var(--sky2));position:relative;overflow:hidden;padding:34px 0 26px}
.hero svg{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}
.hero .wrap{position:relative}
.hero h1{font-family:'Baloo Bhaijaan 2',sans-serif;font-size:clamp(30px,6vw,52px);line-height:1.15;margin:0 0 6px}
.hero p{margin:0 0 22px;color:var(--mute);font-weight:600;font-size:18px}
.cats{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
.cat{font:inherit;color:var(--ink);background:var(--card);border:0;border-radius:22px;padding:12px 12px 14px;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:6px;box-shadow:0 6px 18px rgba(20,39,94,.12);min-height:44px}
.cat img{height:110px;max-width:100%;object-fit:contain;border-radius:12px}
.cat b{font-family:'Baloo Bhaijaan 2',sans-serif;font-size:20px;line-height:1.1}
.cat span{font-size:13px;color:var(--mute);font-weight:600}
h2{font-family:'Baloo Bhaijaan 2',sans-serif;font-size:30px;margin:34px 0 0;line-height:1.2}
.note{color:var(--mute);margin:0 0 14px;font-weight:600}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:16px}
.card{background:var(--card);border:2px solid var(--line);border-radius:26px;padding:12px;display:flex;flex-direction:column;gap:10px}
.pic{position:relative;aspect-ratio:1/1;background:#F7F8FA;border-radius:18px;display:flex;align-items:center;justify-content:center;overflow:hidden}
.pic img{width:100%;height:100%;object-fit:contain;padding:8px}
.pic .ph{font-family:'Baloo Bhaijaan 2',sans-serif;font-weight:800;font-size:150px;line-height:1}
.pic .ph small{display:block;font-size:22px;text-align:center;color:#4A5675}
.bd{position:absolute;top:10px;inset-inline-start:10px;min-width:44px;height:44px;padding:0 10px;border-radius:14px;display:flex;align-items:center;justify-content:center;font-family:'Baloo Bhaijaan 2',sans-serif;font-weight:800;font-size:26px}
.nm{font-weight:800;font-size:19px;line-height:1.2;padding:0 6px;direction:ltr;text-align:start}
.sub{color:var(--mute);font-size:14px;font-weight:600;padding:0 6px;direction:ltr;text-align:start;margin-top:-6px}
.seg{display:flex;gap:8px}
.seg button{flex:1;font:inherit;background:var(--soft);color:var(--ink);border:2px solid transparent;border-radius:14px;padding:6px;min-height:56px;cursor:pointer;line-height:1.2}
.seg button[aria-pressed="true"]{border-color:var(--red);background:var(--card)}
.seg b{display:block;font-size:21px}
.seg span{font-size:13px;color:var(--mute);font-weight:600}
.buy{display:flex;gap:8px}
.st{font-weight:700;font-size:14px;color:var(--mute);padding:0 6px;margin-bottom:6px}
.buyw{border-top:2px dashed var(--line);padding-top:10px}
.un{color:var(--red)}
.qi{width:84px;flex:none;text-align:center;font-weight:800;font-size:20px;padding:0 6px;direction:ltr}
.qi[aria-invalid="true"]{border-color:var(--red)}
.q input{width:56px;text-align:center;padding:0;font-weight:800;min-height:44px;direction:ltr}
.add{flex:1;font:inherit;font-weight:800;font-size:17px;background:var(--navy);color:var(--on-navy);border:0;border-radius:16px;min-height:48px;cursor:pointer}
.bar{position:fixed;inset:auto 0 0;background:var(--hd);backdrop-filter:blur(10px);border-top:2px solid var(--line);padding:10px 20px calc(10px + env(safe-area-inset-bottom,0px));z-index:20;display:flex;justify-content:center}
.bar button{font:inherit;font-weight:800;font-size:18px;width:100%;max-width:1060px;min-height:52px;border-radius:26px;border:0;background:var(--red);color:var(--on-red);cursor:pointer;display:flex;justify-content:space-between;align-items:center;padding:0 24px}
.shade{position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:30;display:none}
.shade.open{display:block}
.sheet{position:absolute;inset:auto 0 0;max-height:92%;overflow:auto;background:var(--bg);border-radius:26px 26px 0 0;padding:22px 20px calc(22px + env(safe-area-inset-bottom,0px));max-width:640px;margin:auto}
.sheet h3{margin:0 0 12px;font-family:'Baloo Bhaijaan 2',sans-serif;font-size:26px;display:flex;justify-content:space-between;align-items:center}
.x{font:inherit;font-size:22px;background:var(--soft);color:var(--ink);border:0;border-radius:50%;width:44px;height:44px;cursor:pointer}
.li{display:flex;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid var(--line)}
.li img{width:52px;height:52px;object-fit:contain;background:#F7F8FA;border-radius:12px}
.li .d{flex:1;font-weight:600;line-height:1.25;direction:ltr;text-align:start}.li .d small{display:block;color:var(--mute);direction:rtl;text-align:start}
.q{display:flex;align-items:center;gap:6px}
.q button{font:inherit;font-size:20px;font-weight:800;width:44px;height:44px;border-radius:12px;border:2px solid var(--line);background:var(--card);color:var(--ink);cursor:pointer}
.q span{min-width:24px;text-align:center;font-weight:800}
.tot{display:flex;justify-content:space-between;font-size:22px;font-weight:800;margin:16px 0}
label{display:block;font-weight:600;margin:10px 0 4px;font-size:15px}
input{font:inherit;width:100%;min-height:48px;border:2px solid var(--line);border-radius:14px;padding:0 14px;background:var(--card);color:var(--ink)}
.wa{display:flex;justify-content:center;align-items:center;width:100%;border:0;font-family:inherit;cursor:pointer;min-height:54px;margin-top:16px;border-radius:27px;background:#1B7A43;color:#fff;font-weight:800;font-size:18px;text-decoration:none}
.alt{display:flex;justify-content:center;align-items:center;width:100%;font-family:inherit;cursor:pointer;min-height:48px;margin-top:10px;border-radius:24px;background:transparent;color:var(--ink);border:2px solid var(--line);font-weight:700;font-size:16px}
.alt[aria-disabled="true"]{opacity:.5;pointer-events:none}
.stt{margin-top:10px;font-weight:600;color:var(--mute);text-align:center;min-height:1.4em}
.stt a{color:var(--red);font-weight:800}

.wa[aria-disabled="true"]{opacity:.5;pointer-events:none}
.empty{color:var(--mute);padding:24px 0;text-align:center}
footer{text-align:center;color:var(--mute);padding:10px 20px 30px;font-size:14px}
@media (max-width:560px){.ht span{display:none}.ht b{font-size:19px;white-space:nowrap}.cat img{height:84px}.cat b{font-size:16px}.cat span{display:none}}
</style>
</head>

function drawCart(){var L=lines(),n=0,t=0,h='';
L.forEach(function(l){n+=l.q;t+=l.q*l.pr;
h+='<div class="li">'+(l.img?'<img src="'+IM[l.img]+'" alt="">':'')+'<div class="d">'+esc(l.name)+'<small>'+l.unit+' · '+f(l.pr)+'</small></div><div class="q"><button type="button" data-m="-1" data-k="'+l.k+'" aria-label="إنقاص">−</button><input class="qc" type="text" inputmode="numeric" pattern="[0-9]*" maxlength="4" value="'+l.q+'" data-k="'+l.k+'" aria-label="الكمية"><button type="button" data-m="1" data-k="'+l.k+'" aria-label="زيادة">+</button></div></div>'});
document.getElementById('items').innerHTML=h||'<div class="empty">الطلبية فارغة، اختر الأصناف من القائمة</div>';
document.getElementById('foot').style.display=L.length?'block':'none';
document.getElementById('cnt').textContent=n?('عرض الطلبية · '+n+' صنف'):'طلبيتك فارغة';
document.getElementById('sum').textContent=n?f(t):'';
document.getElementById('tot').textContent=f(t);
var nm=document.getElementById('nm').value.trim();
var m='طلبية جديدة من المتجر:\n'+L.map(function(l){return '• '+l.name+' ('+l.unit+') × '+l.q+' = '+f(l.q*l.pr)}).join('\n')+'\nالإجمالي: '+f(t)+'\nاسم الصيدلية: '+nm;
var a=document.getElementById('wa');MSG=m;
var ok=(L.length&&nm)?'false':'true';a.setAttribute('aria-disabled',ok);a.href=ok==='false'?waUrl():'#'}
function go(e){var b=e.target.closest('button');if(!b)return;tab=b.dataset.t;drawTabs();drawMain();var m=document.getElementById('main');window.scrollTo({top:m.offsetTop-60,behavior:'smooth'})}
document.getElementById('tabs').onclick=go;document.getElementById('cats').onclick=go;
document.getElementById('main').onclick=function(e){var c=e.target.closest('.card');if(!c)return;
var s=e.target.closest('.seg button');
if(s){c.dataset.u=s.dataset.u;c.querySelectorAll('.seg button').forEach(function(b){b.setAttribute('aria-pressed',b===s)});c.querySelector('.buyw').hidden=false;c.querySelector('.un').textContent='('+s.querySelector('span').textContent+')';var qi=c.querySelector('.qi');qi.focus();qi.select();return}
var a=e.target.closest('.add');
if(a){var qi2=c.querySelector('.qi'),q=parseInt(qi2.value,10);
if(!q||q<1){qi2.setAttribute('aria-invalid','true');qi2.focus();return}
var k=c.dataset.id+'|'+c.dataset.u;cart[k]=Math.min((cart[k]||0)+q,9999);drawCart();qi2.value='1';a.textContent='تمت الإضافة ✓';setTimeout(function(){a.textContent='أضف إلى الطلبية';c.querySelector('.buyw').hidden=true;c.dataset.u='';c.querySelectorAll('.seg button').forEach(function(b){b.setAttribute('aria-pressed','false')})},900)}};
function digits(v){return v.replace(/[٠-٩]/g,function(d){return d.charCodeAt(0)-1632}).replace(/[۰-۹]/g,function(d){return d.charCodeAt(0)-1776}).replace(/[^0-9]/g,'').replace(/^0+(?=\d)/,'')}
document.getElementById('main').oninput=function(e){var t=e.target;if(t.classList.contains('qi')){t.value=digits(t.value);t.removeAttribute('aria-invalid')}};
document.getElementById('main').onkeydown=function(e){if(e.key==='Enter'&&e.target.classList.contains('qi')){e.preventDefault();e.target.closest('.card').querySelector('.add').click()}};
document.getElementById('items').onclick=function(e){var b=e.target.closest('button');if(!b)return;
var k=b.dataset.k;cart[k]=Math.min(cart[k]+(+b.dataset.m),9999);if(cart[k]<1)delete cart[k];drawCart()};
document.getElementById('items').oninput=function(e){if(e.target.classList.contains('qc'))e.target.value=digits(e.target.value)};
document.getElementById('items').onchange=function(e){var t=e.target;if(!t.classList.contains('qc'))return;var v=parseInt(t.value,10);if(!v||v<1)delete cart[t.dataset.k];else cart[t.dataset.k]=v;drawCart()};
['nm'].forEach(function(i){document.getElementById(i).oninput=drawCart});
document.getElementById('open').onclick=function(){document.getElementById('shade').classList.add('open')};
document.getElementById('close').onclick=function(){document.getElementById('shade').classList.remove('open')};
document.getElementById('shade').onclick=function(e){if(e.target.id==='shade')this.classList.remove('open')};
var MSG='';
function setStt(x){document.getElementById('stt').textContent=x}
function waUrl(){
var L=lines(),t=0;L.forEach(function(l){t+=l.q*l.pr});
var d=new Date(),z=function(n){return('0'+n).slice(-2)};
var dt=z(d.getDate())+'/'+z(d.getMonth()+1)+'/'+d.getFullYear()+' '+z(d.getHours())+':'+z(d.getMinutes());
var nm=document.getElementById('nm').value.trim();
var m='طلبية جديدة\nالتاريخ: '+dt+'\nاسم الصيدلية: '+nm+'\nإجمالي الطلبية: '+f(t)+'\n\nالأصناف:\n'+L.map(function(l,i){return(i+1)+') '+l.name+' — '+l.unit+' × '+l.q}).join('\n');
return'https://wa.me/'+WA+'?text='+encodeURIComponent(m)}
document.getElementById('wa').onclick=function(){if(this.getAttribute('aria-disabled')==='true')return false;this.href=waUrl()};
drawTabs();drawMain();drawCart();
</script>
</body>
</html>
